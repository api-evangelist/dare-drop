name: Dare Drop
description: >-
  Dare Drop is a gaming influencer marketing platform that connects game
  publishers and brands with content creators across Twitch, YouTube, and
  TikTok. The platform runs reward-driven "Dares" — challenges that incentivize
  streamers and creators to produce longer, more engaging content around a
  title, while automating creator targeting, campaign management, and reporting.
  Dare Drop offers influencer campaigns, ongoing influencer programs, and organic
  outreach, and has facilitated over 18,000 publisher Dares and distributed more
  than 30,000 rewards to creator communities. Its customers include game studios
  and publishers such as EA, Respawn, Raw Fury, Tencent, Obsidian, and Gearbox.
  Surfaced as an a16z portfolio company and profiled in the API Evangelist
  network; no public developer API surface has been found to date.
